
name: CP77-DiscordRPC2 Build 2.5.1

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Premake5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:RUNNER_TEMP/premake.zip"
          $dir = "$env:RUNNER_TEMP/premake"

          Invoke-WebRequest `
            "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip" `
            -OutFile $zip

          Expand-Archive $zip $dir -Force

          $exe = Get-ChildItem $dir -Filter premake5.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "Premake5 executable not found."
          }

          "PREMAKE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Locate project
        id: project
        shell: pwsh
        run: |
          $script = Get-ChildItem . -Filter premake5.lua -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](.git|vendor)[\\/]'
            } |
            Select-Object -First 1

          if (-not $script) {
            throw "premake5.lua not found."
          }

          "dir=$($script.Directory.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install Discord SDK
        shell: pwsh
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          $ErrorActionPreference = "Stop"

          # Check whether the repository already provides the SDK.
          $sdk = Get-ChildItem . -Directory -Recurse |
            Where-Object {
              $_.Name -eq "discord_game_sdk"
            } |
            Select-Object -First 1

          if (-not $sdk) {
            throw "The Discord SDK directory is missing. Check the repository's documented SDK path and dependency instructions."
          }

          Write-Host "Found SDK directory: $($sdk.FullName)"

      - name: Generate Visual Studio project
        shell: pwsh
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          & $env:PREMAKE_EXE vs2022

          if ($LASTEXITCODE -ne 0) {
            throw "Premake generation failed."
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find solution
        id: solution
        shell: pwsh
        run: |
          $sln = Get-ChildItem . -Filter *.sln -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](.git|vendor)[\\/]'
            } |
            Select-Object -First 1

          if (-not $sln) {
            throw "No Visual Studio solution was generated."
          }

          "path=$($sln.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build Release
        shell: pwsh
        run: |
          msbuild "${{ steps.solution.outputs.path }}" `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed."
          }

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: CP77-DiscordRPC2-build
          path: |
            **/cp77rpc2.dll
            **/discord_game_sdk.dll
          if-no-files-found: error
          retention-days: 14
