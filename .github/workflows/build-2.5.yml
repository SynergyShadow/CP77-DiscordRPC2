name: CP77-DiscordRPC2 Build 2.5.1

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout CP77-DiscordRPC2
        uses: actions/checkout@v4
        with:
          repository: SynergyShadow/CP77-DiscordRPC2
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Set up Premake5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip"
          $zip = Join-Path $env:RUNNER_TEMP "premake.zip"
          $dir = Join-Path $env:RUNNER_TEMP "premake"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe = Get-ChildItem -Path $dir -Filter "premake5.exe" -Recurse -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "premake5.exe was not found in the downloaded archive."
          }

          "PREMAKE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Premake executable: $($exe.FullName)"

      - name: Locate Premake script
        id: premake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = Get-ChildItem -Path . -Filter "premake5.lua" -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](vendor|\.git)[\\/]' } |
            Select-Object -First 1

          if (-not $script) {
            throw "premake5.lua was not found in this repository."
          }

          $dir = $script.Directory.FullName
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "Premake script directory: $dir"

      - name: Generate Visual Studio project
        shell: pwsh
        working-directory: ${{ steps.premake.outputs.dir }}
        run: |
          $ErrorActionPreference = "Stop"

          & $env:PREMAKE_EXE vs2022

          if ($LASTEXITCODE -ne 0) {
            throw "Premake project generation failed with exit code $LASTEXITCODE."
          }

      - name: Locate solution
        id: solution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $solution = Get-ChildItem -Path . -Filter "*.sln" -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](vendor|\.git)[\\/]' } |
            Select-Object -First 1

          if (-not $solution) {
            throw "No Visual Studio solution was generated."
          }

          "path=$($solution.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Solution: $($solution.FullName)"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild "${{ steps.solution.outputs.path }}" `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE."
          }

      - name: Collect build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $out = Join-Path $PWD "artifact"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $dlls = Get-ChildItem -Path . -Filter "*.dll" -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '[\\/](vendor|\.git|artifact)[\\/]' -and
              $_.FullName -match '[\\/](bin|build|release|x64)[\\/]'
            }

          if (-not $dlls) {
            $dlls = Get-ChildItem -Path . -Filter "*.dll" -Recurse -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](vendor|\.git|artifact)[\\/]'
              }
          }

          if (-not $dlls) {
            throw "No compiled DLLs were found."
          }

          $dlls | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            Copy-Item $_.FullName $out -Force
          }

          Get-ChildItem $out -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CP77-DiscordRPC2-2.5.1
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
