name: Build CP77 Discord RPC 2

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update RED4ext SDK
        shell: pwsh
        run: |
          $sdk = "src/red4ext/libs/RED4ext.SDK"

          if (!(Test-Path "$sdk/.git")) {
            git submodule update --init --recursive
          }

          git -C $sdk fetch origin
          git -C $sdk checkout origin/master
          git -C $sdk log -1 --oneline

      - name: Install Premake
        shell: pwsh
        run: |
          $url = "https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/premake.zip"

          Expand-Archive `
            -Path "$env:RUNNER_TEMP/premake.zip" `
            -DestinationPath "$env:RUNNER_TEMP/premake" `
            -Force

          $premake = Get-ChildItem "$env:RUNNER_TEMP/premake" `
            -Filter "premake5.exe" -Recurse |
            Select-Object -First 1

          if (!$premake) {
            throw "premake5.exe was not found in the downloaded archive."
          }

          "PREMAKE_DIR=$($premake.DirectoryName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "PATH=$($premake.DirectoryName);$env:PATH" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Discord Game SDK
        shell: pwsh
        run: |
          $url = "https://dl-game-sdk.discordapp.net/2.5.6/discord_game_sdk.zip"
          $zip = "$env:RUNNER_TEMP/discord_game_sdk.zip"
          $extract = "$env:RUNNER_TEMP/discord_game_sdk"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $sdkRoot = Get-ChildItem $extract -Directory -Recurse |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "lib/x86_64")) -and
              (Test-Path (Join-Path $_.FullName "include/discord_game_sdk.h"))
            } |
            Select-Object -First 1

          if (!$sdkRoot) {
            throw "Could not find the expected Discord Game SDK directory layout."
          }

          $destination = "src/red4ext/libs/discord_game_sdk"

          New-Item -ItemType Directory -Path $destination -Force |
            Out-Null

          Copy-Item "$($sdkRoot.FullName)/*" $destination -Recurse -Force

          if (!(Test-Path "$destination/lib/x86_64/discord_game_sdk.dll")) {
            throw "Discord Game SDK DLL was not found after extraction."
          }

      - name: Generate Visual Studio project
        shell: pwsh
        run: |
          premake5 configure
          if ($LASTEXITCODE -ne 0) {
            throw "Premake configure failed."
          }

          premake5 vs2022
          if ($LASTEXITCODE -ne 0) {
            throw "Premake VS2022 generation failed."
          }

      - name: Build plugin
        shell: pwsh
        run: |
          if (!(Test-Path "cp77rpc2.sln")) {
            throw "cp77rpc2.sln was not generated."
          }

          msbuild cp77rpc2.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "Plugin build failed."
          }

      - name: Prepare plugin files
        shell: pwsh
        run: |
          $buildDir = "src/red4ext/build/Configuration"
          $dll = Get-ChildItem $buildDir -Filter "cp77rpc2.dll" -Recurse |
            Select-Object -First 1

          if (!$dll) {
            throw "cp77rpc2.dll was not produced by the build."
          }

          $output = "artifacts"
          New-Item -ItemType Directory -Path $output -Force |
            Out-Null

          Copy-Item $dll.FullName "$output/cp77rpc2.dll" -Force
          Copy-Item `
            "src/red4ext/libs/discord_game_sdk/lib/x86_64/discord_game_sdk.dll" `
            "$output/discord_game_sdk.dll" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CP77-DiscordRPC2
          path: artifacts/
          if-no-files-found: error
