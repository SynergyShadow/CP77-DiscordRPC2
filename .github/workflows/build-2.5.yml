
name: CP77-DiscordRPC2 Build 2.5.1

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout CP77-DiscordRPC2
        uses: actions/checkout@v4
        with:
          repository: SynergyShadow/CP77-DiscordRPC2
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Set up Premake5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install premake --yes --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Premake5."
          }

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command premake5 -ErrorAction SilentlyContinue)) {
            if (-not (Get-Command premake -ErrorAction SilentlyContinue)) {
              throw "Premake executable was not found."
            }
          }

          if (-not (Test-Path "premake5.lua")) {
            throw "premake5.lua was not found."
          }

      - name: Configure project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          premake5 configure
          if ($LASTEXITCODE -ne 0) {
            throw "Premake configure failed."
          }

          premake5 vs2022
          if ($LASTEXITCODE -ne 0) {
            throw "Visual Studio project generation failed."
          }

      - name: Locate solution
        id: solution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $solution = Get-ChildItem -Path . -Filter "cp77rpc2.sln" -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](vendor|\.git)[\\/]' } |
            Select-Object -First 1

          if (-not $solution) {
            throw "cp77rpc2.sln was not generated."
          }

          "path=$($solution.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build Release
        uses: microsoft/setup-msbuild@v2

      - name: Compile CP77-DiscordRPC2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          msbuild "${{ steps.solution.outputs.path }}" `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RestorePackagesConfig=true `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "CP77-DiscordRPC2 compilation failed."
          }

      - name: Collect compiled files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dll = Get-ChildItem -Path "src/red4ext" `
            -Filter "cp77rpc2.dll" -Recurse -File |
            Select-Object -First 1

          if (-not $dll) {
            $dll = Get-ChildItem -Path . `
              -Filter "cp77rpc2.dll" -Recurse -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](vendor|\.git)[\\/]'
              } |
              Select-Object -First 1
          }

          if (-not $dll) {
            throw "cp77rpc2.dll was not produced."
          }

          $sdk = Get-ChildItem -Path "src/red4ext/libs" `
            -Filter "discord_game_sdk.dll" -Recurse -File |
            Select-Object -First 1

          if (-not $sdk) {
            throw "discord_game_sdk.dll was not found."
          }

          $out = Join-Path $PWD "artifact"
          New-Item -ItemType Directory -Path $out -Force |
            Out-Null

          Copy-Item $dll.FullName (Join-Path $out "cp77rpc2.dll")
          Copy-Item $sdk.FullName (Join-Path $out "discord_game_sdk.dll")

          Get-FileHash (Join-Path $out "cp77rpc2.dll") -Algorithm SHA256
          Get-FileHash (Join-Path $out "discord_game_sdk.dll") -Algorithm SHA256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CP77-DiscordRPC2-2.5.1
          path: artifact/*.dll
          if-no-files-found: error
          retention-days: 14
